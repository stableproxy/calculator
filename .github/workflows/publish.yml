name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Check the committed hash matches the committed module
        run: |
          actual="$(node -e 'const fs=require("fs"),c=require("crypto");const s=fs.readFileSync("module/dist.js","utf8").replace(/constructor\(rates\s*=\s*\{[^}]*\}\)/g,"constructor(rates = {})");process.stdout.write(c.createHash("md5").update(s,"utf8").digest("hex"))')"
          committed="$(tr -d '[:space:]' < dist.md5)"
          if [ "$actual" != "$committed" ]; then
            echo "::error::dist.md5 ($committed) does not match module/dist.js ($actual). Regenerate with php artisan js:generate-calculator-module."
            exit 1
          fi

      - name: Compare with the latest release
        id: hash
        run: |
          if ! latest="$(npm view @stableproxy/calculator version 2>"$RUNNER_TEMP/npm-view.err")"; then
            cat "$RUNNER_TEMP/npm-view.err" >&2
            if grep -q E404 "$RUNNER_TEMP/npm-view.err"; then
              latest=0.0.0
            else
              echo "::error::npm view @stableproxy/calculator failed and the error is not E404; refusing to guess the latest version."
              exit 1
            fi
          fi
          if [ -z "$latest" ]; then
            echo "::error::npm view @stableproxy/calculator returned no version."
            exit 1
          fi
          published=""
          if [ "$latest" != "0.0.0" ]; then
            mkdir -p "$RUNNER_TEMP/released"
            if ! npm pack "@stableproxy/calculator@$latest" --pack-destination "$RUNNER_TEMP/released" --silent >/dev/null; then
              echo "::error::npm pack @stableproxy/calculator@$latest failed; cannot compare with the latest release."
              exit 1
            fi
            if ! tar -xzf "$RUNNER_TEMP"/released/*.tgz -C "$RUNNER_TEMP/released"; then
              echo "::error::could not unpack @stableproxy/calculator@$latest."
              exit 1
            fi
            published="$(tr -d '[:space:]' < "$RUNNER_TEMP/released/package/dist.md5" 2>/dev/null || true)"
          fi
          next="$(echo "$latest" | awk -F. -v OFS=. '{$NF++;print}')"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          if [ "$(tr -d '[:space:]' < dist.md5)" = "$published" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::module logic unchanged since $latest; nothing to publish."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set the release version
        if: steps.hash.outputs.changed == 'true'
        run: |
          npm version "${{ steps.hash.outputs.next }}" --no-git-tag-version --allow-same-version
          echo "${{ steps.hash.outputs.next }}" > .version

      - name: Build dist
        if: steps.hash.outputs.changed == 'true'
        run: npx -y -p typescript@5 tsc -p .

      - name: Smoke-test the built bundles
        if: steps.hash.outputs.changed == 'true'
        run: |
          node --check module/dist.js
          node --check window/dist.js
          node --check require/dist.js
          node --check dist/dist.js
          node - <<'JS'
          const assert = require('node:assert');
          console.debug = () => {}; console.log = () => {};

          const cases = [
            { proxyFor: 'shared',             trafficInGb: 0,    expect: 50.15 },
            { proxyFor: 'shared',             trafficInGb: 500,  expect: 8.15  },
            { proxyFor: 'residential_gb',     trafficInGb: 333,  expect: 316.35 },
            { proxyFor: 'datacenter_gb',      trafficInGb: 333,  expect: 233.1 },
            { proxyFor: 'mobile_rotating_gb', trafficInGb: 333,  expect: 416.25 },
            { proxyFor: 'mobile_rotating_gb', trafficInGb: 1000, expect: 1100 },
            { proxyFor: 'mobile_gb',          trafficInGb: 77,   expect: 65.45 },
            { proxyFor: 'mobile_shared_gb',   trafficInGb: 77,   expect: 65.45 },
            { proxyFor: 'mobile_gb',          trafficInGb: 333,  expect: 249.75 },
            { proxyFor: 'mobile_gb',          trafficInGb: 1000, expect: 600 },
            { proxyFor: 'mobile_gb',          trafficInGb: 10, daysCount: 1,  expect: 10 },
            { proxyFor: 'mobile_shared_gb',   trafficInGb: 10, daysCount: 30, expect: 10 },
            { proxyFor: 'mobile_static_gb',   trafficInGb: 10, daysCount: 1,  expect: 7  },
            { proxyFor: 'mobile_static_gb',   trafficInGb: 10, daysCount: 7,  expect: 15 },
            { proxyFor: 'mobile_static_gb',   trafficInGb: 10, daysCount: 14, expect: 25 },
            { proxyFor: 'mobile_static_gb',   trafficInGb: 10, daysCount: 30, expect: 33 },
            { proxyFor: 'mobile_private_gb',  trafficInGb: 10, daysCount: 1,  expect: 7  },
            { proxyFor: 'mobile_private_gb',  trafficInGb: 10, daysCount: 7,  expect: 15 },
            { proxyFor: 'mobile_private_gb',  trafficInGb: 10, daysCount: 14, expect: 25 },
            { proxyFor: 'mobile_private_gb',  trafficInGb: 10, daysCount: 30, expect: 33 },
          ];

          for (const entry of ['./require/dist.js', './dist/dist.js']) {
            const mod = require(entry);
            const Calculator = mod.Calculator || mod.default;
            const { CalculatorInput } = mod;
            assert.ok(Calculator, `${entry} exports no Calculator`);
            assert.ok(CalculatorInput, `${entry} exports no CalculatorInput`);
            assert.strictEqual(typeof Calculator.prototype.setCatalog, 'function', `${entry} has no setCatalog`);

            const calc = new Calculator();
            for (const { expect, ...c } of cases) {
              const out = calc.calculate(new CalculatorInput({ currency: 'USD', proxyCount: 1, daysCount: 29, ...c }));
              assert.strictEqual(out.overallUSD, expect, `${entry}: ${JSON.stringify(c)} priced ${out.overallUSD}, expected ${expect}`);
            }

            const sheet = JSON.parse(JSON.stringify(calc.getPricing()));
            sheet.per_gb.datacenter_gb = { '1': 1 };
            const changed = new Calculator().setCatalog({ pricing: sheet }).calculate(
              new CalculatorInput({ currency: 'USD', proxyCount: 1, daysCount: 29, proxyFor: 'datacenter_gb', trafficInGb: 30 }),
            ).overallUSD;
            assert.strictEqual(changed, 30, `${entry}: setCatalog() pricing was ignored (${changed})`);
          }

          {
            const mod = require('./require/dist.js');
            const calc = new mod.Calculator();
            const price = (opts) => calc.calculate(new mod.CalculatorInput({
              currency: 'USD', proxyCount: 1, daysCount: 29, proxyFor: 'shared', ...opts,
            })).overallUSD;

            assert.notStrictEqual(price({ trafficInGb: 0 }), price({ trafficInGb: 25 }),
              'trafficInGb:0 (unlimited) is being replaced by the default');
            assert.notStrictEqual(price({ trafficInGb: 100, isRandomProxy: false }),
              price({ trafficInGb: 100, isRandomProxy: true }),
              'isRandomProxy:false is being replaced by the default');
            assert.ok(Number.isFinite(price({ trafficInGb: 100, version: 20 })), 'a legacy version throws or returns NaN');
          }

          console.error('smoke test passed');
          JS

      - name: Publish to npm
        if: steps.hash.outputs.changed == 'true'
        run: npm publish --access public

      - name: Record the release in git
        if: steps.hash.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .version dist
          git commit -m "[#] Release ${{ steps.hash.outputs.next }} [skip ci]"
          git push origin HEAD:main

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.hash.outputs.changed }}" = "true" ]; then
            echo "Published \`@stableproxy/calculator@${{ steps.hash.outputs.next }}\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Module logic unchanged since \`${{ steps.hash.outputs.latest }}\` — nothing published." >> "$GITHUB_STEP_SUMMARY"
          fi
