# Publishes @stableproxy/calculator to npm.
#
# Uses npm TRUSTED PUBLISHING (OIDC): npmjs.com is configured to trust this
# repository and this workflow file, so the job mints a short-lived token from
# GitHub's OIDC provider at publish time. That means:
#
#   * no NPM_TOKEN secret to leak or rotate, and
#   * no 2FA prompt — which is what blocked publishing from a laptop.
#
# The trust is registered against this EXACT path (.github/workflows/publish.yml).
# Renaming or moving this file silently breaks publishing until the trusted
# publisher entry on npmjs.com is updated to match.
#
# Releases are cut by upload.sh, which builds, bumps the version and pushes —
# the push is what triggers this workflow.
name: publish

on:
  push:
    branches: [main]
  # Manual re-run, for when a release commit landed but the publish failed.
  workflow_dispatch:

permissions:
  contents: read
  # Required for trusted publishing. Without it npm falls back to looking for a
  # token and fails with E403.
  id-token: write

# Never let two releases race the registry.
concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14.0.
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # …and npm >= 11.5.1, which is newer than what some Node 22 releases bundle.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Read version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # The repo can legitimately move without a release (docs, this workflow),
      # and a failed publish gets re-run — so publishing has to be idempotent.
      - name: Check whether this version is already on npm
        id: check
        run: |
          if npm view "@stableproxy/calculator@${{ steps.pkg.outputs.version }}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ steps.pkg.outputs.version }} is already on npm — nothing to do."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # The bundle is machine-generated by a regex transpiler in the backend, so
      # "it parses" is not a given: v1.0.63 shipped a ReferenceError that only
      # fired for one proxy type. Load every entry point and price something
      # before this reaches anyone's node_modules.
      - name: Smoke-test the built bundles
        if: steps.check.outputs.published == 'false'
        run: |
          node --check module/dist.js
          node --check window/dist.js
          node --check require/dist.js
          node --check dist/dist.js
          node - <<'JS'
          const assert = require('node:assert');
          console.debug = () => {}; console.log = () => {};

          // Cases chosen to cross every pricing branch, not just the happy path.
          // `expect` is the published price: when one of these changes on purpose
          // it has to be updated here in the same commit, which is the point —
          // a silent price change is exactly what must not reach npm.
          //
          // daysCount is pinned per case. The modem types step their price by
          // period, so leaving it to the bundle default hides half the ladder.
          const cases = [
            { proxyFor: 'shared',             trafficInGb: 0,    expect: 50.15 },
            { proxyFor: 'shared',             trafficInGb: 500,  expect: 8.15  },
            { proxyFor: 'residential_gb',     trafficInGb: 333,  expect: 316.35 },
            { proxyFor: 'mobile_rotating_gb', trafficInGb: 1000, expect: 600 },
            { proxyFor: 'datacenter_gb',      trafficInGb: 333,  expect: 233.1 },

            // Shared modem: pure pay-as-you-go, the period must not move it.
            { proxyFor: 'mobile_gb',          trafficInGb: 77,   expect: 65.45 },
            { proxyFor: 'mobile_shared_gb',   trafficInGb: 77,   expect: 65.45 },
            { proxyFor: 'mobile_gb',          trafficInGb: 10, daysCount: 1,  expect: 8.5 },
            { proxyFor: 'mobile_shared_gb',   trafficInGb: 10, daysCount: 30, expect: 8.5 },

            // Dedicated modem: period fee + traffic, 1/7/14/30 day bands.
            // mobile_private_gb is the same product and must price identically.
            { proxyFor: 'mobile_static_gb',   trafficInGb: 10, daysCount: 1,  expect: 7  },
            { proxyFor: 'mobile_static_gb',   trafficInGb: 10, daysCount: 7,  expect: 15 },
            { proxyFor: 'mobile_static_gb',   trafficInGb: 10, daysCount: 14, expect: 25 },
            { proxyFor: 'mobile_static_gb',   trafficInGb: 10, daysCount: 30, expect: 33 },
            { proxyFor: 'mobile_private_gb',  trafficInGb: 10, daysCount: 1,  expect: 7  },
            { proxyFor: 'mobile_private_gb',  trafficInGb: 10, daysCount: 7,  expect: 15 },
            { proxyFor: 'mobile_private_gb',  trafficInGb: 10, daysCount: 14, expect: 25 },
            { proxyFor: 'mobile_private_gb',  trafficInGb: 10, daysCount: 30, expect: 33 },
          ];

          for (const entry of ['./require/dist.js', './dist/dist.js']) {
            const mod = require(entry);
            // The npm main exports Calculator as default; require/ names it.
            const Calculator = mod.Calculator || mod.default;
            const { CalculatorInput } = mod;
            assert.ok(Calculator, `${entry} exports no Calculator`);
            assert.ok(CalculatorInput, `${entry} exports no CalculatorInput`);

            const calc = new Calculator();
            for (const { expect, ...c } of cases) {
              const out = calc.calculate(new CalculatorInput({
                currency: 'USD', proxyCount: 1, daysCount: 29, ...c,
              }));
              assert.strictEqual(
                out.overallUSD, expect,
                `${entry}: ${JSON.stringify(c)} priced ${out.overallUSD}, expected ${expect}`,
              );
            }
          }

          // Falsy arguments must reach the calculator instead of being replaced
          // by defaults — 0 GB means UNLIMITED traffic, and isRandomProxy:false
          // carries a surcharge. Both were swallowed by a `||` fallback once.
          {
            const mod = require('./require/dist.js');
            const calc = new mod.Calculator();
            const price = (opts) => calc.calculate(new mod.CalculatorInput({
              currency: 'USD', proxyCount: 1, daysCount: 29, proxyFor: 'shared', ...opts,
            })).overallUSD;

            assert.notStrictEqual(price({ trafficInGb: 0 }), price({ trafficInGb: 25 }),
              'trafficInGb:0 (unlimited) is being replaced by the default');
            assert.notStrictEqual(price({ trafficInGb: 100, isRandomProxy: false }),
              price({ trafficInGb: 100, isRandomProxy: true }),
              'isRandomProxy:false is being replaced by the default');
          }

          console.error('smoke test passed');
          JS

      - name: Publish to npm
        if: steps.check.outputs.published == 'false'
        # No NODE_AUTH_TOKEN and no .npmrc: the OIDC token is picked up
        # automatically, and provenance attestation is generated for free.
        run: npm publish --access public

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.check.outputs.published }}" = "true" ]; then
            echo "\`${{ steps.pkg.outputs.version }}\` was already published — skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Published \`@stableproxy/calculator@${{ steps.pkg.outputs.version }}\`." >> "$GITHUB_STEP_SUMMARY"
          fi
